name: Molecule Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  molecule:
    name: Molecule
    # The 26.04 container's sudo fails PAM account checks under some hosts' AppArmor
    # unix-chkpwd profile; the 26.04 runner is known to work for all three images.
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        platform:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Molecule tests
        run: molecule test --platform-name ${{ matrix.platform }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
